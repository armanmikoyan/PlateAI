services:
  web:
    build:
      context: .
      dockerfile: apps/plateUI/Dockerfile
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_SERVER_URL: http://auth:4000
    init: true
    depends_on:
      - auth
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  auth:
    build:
      context: .
      dockerfile: apps/plateServer/Dockerfile
      target: dev
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
    volumes:
      - ./apps/plateServer:/app/apps/plateServer
      - /app/node_modules
    init: true