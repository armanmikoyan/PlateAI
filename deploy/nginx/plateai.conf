# plateai.fit (UI) -> plate-ui:3000
server {
    server_name plateai.fit www.plateai.fit;

    client_max_body_size 12m;

    location / {
        proxy_pass http://plate-ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/plateai.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plateai.fit/privkey.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name plateai.fit www.plateai.fit;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

