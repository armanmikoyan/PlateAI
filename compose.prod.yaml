services:
  plate-server:
    image: ${DOCKER_AUTH_IMAGE}
    container_name: plateai-server
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID}
      LEMON_SQUEEZY_VARIANT_ID_PLUS: ${LEMON_SQUEEZY_VARIANT_ID_PLUS}
      LEMON_SQUEEZY_VARIANT_ID_PRO: ${LEMON_SQUEEZY_VARIANT_ID_PRO}
      LEMON_SQUEEZY_TEST_MODE: ${LEMON_SQUEEZY_TEST_MODE}
    networks:
      - plateai-net

  plate-ui:
    image: ${DOCKER_IMAGE}
    container_name: plateai-ui
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVER_URL: http://plate-server:4000
      AI_TEST_MODE: ${AI_TEST_MODE}
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY}
    depends_on:
      - plate-server
    networks:
      - plateai-net

networks:
  plateai-net:
    name: plateai-net
