services:
  plate-server:
    image: ${DOCKER_AUTH_IMAGE}
    container_name: plateai-server
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID}
      LEMON_SQUEEZY_VARIANT_ID_BASIC: ${LEMON_SQUEEZY_VARIANT_ID_BASIC}
      LEMON_SQUEEZY_VARIANT_ID_PRO: ${LEMON_SQUEEZY_VARIANT_ID_PRO}
      LEMON_SQUEEZY_TEST_MODE: ${LEMON_SQUEEZY_TEST_MODE}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    networks:
      - plateai-net

  plate-ui:
    image: ${DOCKER_IMAGE}
    container_name: plateai-ui
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      PLATE_SERVER_URL: http://plate-server:4000
      AI_TEST_MODE: ${AI_TEST_MODE}
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY}
    depends_on:
      - plate-server
    networks:
      - plateai-net

  nginx:
    image: nginx:alpine
    container_name: plateai-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/plateai.conf:/etc/nginx/conf.d/plateai.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    depends_on:
      - plate-server
      - plate-ui
    networks:
      - plateai-net

networks:
  plateai-net:
    name: plateai-net
