name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: armanmikoyan/plateai
  DOCKER_AUTH_IMAGE: armanmikoyan/plateai-auth
  EC2_APP_DIR: plateai

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment-info.outputs.url }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_URL }}
      AI_TEST_MODE: ${{ vars.AI_TEST_MODE }}
      AI_IMAGE_PROVIDER: ${{ vars.AI_IMAGE_PROVIDER }}
      AI_IMAGE_MODEL: ${{ vars.AI_IMAGE_MODEL }}
      AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MONGODB_URI: ${{ vars.MONGODB_URI }}
      MONGODB_USERNAME: ${{ vars.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
    steps:
      - name: Set deployment URL
        id: deployment-info
        run: echo "url=${{ env.PRODUCTION_URL }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Next.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Build and push auth server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.DOCKER_AUTH_IMAGE }}:latest
            ${{ env.DOCKER_AUTH_IMAGE }}:${{ github.sha }}

      - name: Copy compose manifest
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: compose.prod.yaml
          target: ${{ env.EC2_APP_DIR }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: >-
            AI_TEST_MODE,AI_IMAGE_PROVIDER,AI_IMAGE_MODEL,AI_PROVIDER_API_KEY,
            JWT_SECRET,FRONTEND_URL,GOOGLE_CALLBACK_URL,GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET,MONGODB_URI,MONGODB_USERNAME,MONGODB_PASSWORD,
            DOCKER_IMAGE,DOCKER_AUTH_IMAGE,EC2_APP_DIR
          script: |
            set -euo pipefail
            cd "$HOME/$EC2_APP_DIR"
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                compose() { docker-compose "$@"; }
              else
                mkdir -p "$HOME/.docker/cli-plugins"
                curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-$(uname -m)" \
                  -o "$HOME/.docker/cli-plugins/docker-compose"
                chmod +x "$HOME/.docker/cli-plugins/docker-compose"
                compose() { docker compose "$@"; }
              fi
            else
              compose() { docker compose "$@"; }
            fi
            printf '%s\n' \
              "DOCKER_IMAGE=${DOCKER_IMAGE}:latest" \
              "DOCKER_AUTH_IMAGE=${DOCKER_AUTH_IMAGE}:latest" \
              "JWT_SECRET=${JWT_SECRET}" \
              "MONGODB_URI=${MONGODB_URI}" \
              "MONGODB_USERNAME=${MONGODB_USERNAME}" \
              "MONGODB_PASSWORD=${MONGODB_PASSWORD}" \
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              "GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}" \
              "FRONTEND_URL=${FRONTEND_URL}" \
              "AI_TEST_MODE=${AI_TEST_MODE}" \
              "AI_IMAGE_PROVIDER=${AI_IMAGE_PROVIDER}" \
              "AI_IMAGE_MODEL=${AI_IMAGE_MODEL}" \
              "AI_PROVIDER_API_KEY=${AI_PROVIDER_API_KEY}" \
              > .env
            compose -f compose.prod.yaml down --remove-orphans 2>/dev/null || true
            for name in plateai plateai-auth mealai; do
              docker stop "$name" 2>/dev/null || true
              docker rm "$name" 2>/dev/null || true
            done
            compose -f compose.prod.yaml pull
            compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f

      - name: Deployment summary
        run: 'echo "Live app: ${{ steps.deployment-info.outputs.url }}"'
