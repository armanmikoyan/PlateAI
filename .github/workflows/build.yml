name: Build

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: armanmikoyan/plateai
  DOCKER_AUTH_IMAGE: armanmikoyan/plateai-auth

jobs:
  build:
    name: Build and push frontend + backend images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Next.js image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_URL }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Build and push auth server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_AUTH_IMAGE }}:latest
            ${{ env.DOCKER_AUTH_IMAGE }}:${{ github.sha }}
