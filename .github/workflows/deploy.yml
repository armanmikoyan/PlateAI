name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      EC2_APP_DIR: plateai
      DOCKER_IMAGE: armanmikoyan/plateai:latest
      DOCKER_AUTH_IMAGE: armanmikoyan/plateai-auth:latest
      AI_TEST_MODE: ${{ vars.AI_TEST_MODE }}
      AI_IMAGE_PROVIDER: ${{ vars.AI_IMAGE_PROVIDER }}
      AI_IMAGE_MODEL: ${{ vars.AI_IMAGE_MODEL }}
      AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MONGODB_URI: ${{ vars.MONGODB_URI }}
      MONGODB_USERNAME: ${{ vars.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy compose manifest
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: compose.prod.yaml
          target: ${{ env.EC2_APP_DIR }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: >-
            DOCKER_IMAGE,DOCKER_AUTH_IMAGE,EC2_APP_DIR,
            AI_TEST_MODE,AI_IMAGE_PROVIDER,AI_IMAGE_MODEL,AI_PROVIDER_API_KEY,
            JWT_SECRET,FRONTEND_URL,GOOGLE_CALLBACK_URL,GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET,MONGODB_URI,MONGODB_USERNAME,MONGODB_PASSWORD
          script: |
            set -euo pipefail
            cd "$HOME/$EC2_APP_DIR"
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f

      - name: Deployment summary
        run: 'echo "Live app: ${{ vars.PRODUCTION_URL }}"'