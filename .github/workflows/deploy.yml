name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      EC2_APP_DIR: plateai
      DOCKER_PLATE_UI_IMAGE: armanmikoyan/plateai-ui:latest
      DOCKER_PLATE_SERVER_IMAGE: armanmikoyan/plateai-server:latest
      AI_TEST_MODE: ${{ vars.AI_TEST_MODE }}
      AI_IMAGE_PROVIDER: ${{ vars.AI_IMAGE_PROVIDER }}
      AI_IMAGE_MODEL: ${{ vars.AI_IMAGE_MODEL }}
      AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
      EMAIL_HOST: ${{ vars.EMAIL_HOST }}
      EMAIL_PORT: ${{ vars.EMAIL_PORT }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MONGODB_URI: ${{ vars.MONGODB_URI }}
      MONGODB_USERNAME: ${{ vars.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
      LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
      LEMON_SQUEEZY_STORE_ID: ${{ vars.LEMON_SQUEEZY_STORE_ID }}
      LEMON_SQUEEZY_VARIANT_ID_BASIC: ${{ vars.LEMON_SQUEEZY_VARIANT_ID_BASIC }}
      LEMON_SQUEEZY_VARIANT_ID_PRO: ${{ vars.LEMON_SQUEEZY_VARIANT_ID_PRO }}
      LEMON_SQUEEZY_TEST_MODE: ${{ vars.LEMON_SQUEEZY_TEST_MODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy compose manifest
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: compose.prod.yaml
          target: ${{ env.EC2_APP_DIR }}

      - name: Copy nginx config
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/nginx
          target: ${{ env.EC2_APP_DIR }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: >-
            DOCKER_PLATE_UI_IMAGE,DOCKER_PLATE_SERVER_IMAGE,EC2_APP_DIR,
            AI_TEST_MODE,AI_IMAGE_PROVIDER,AI_IMAGE_MODEL,AI_PROVIDER_API_KEY,
            EMAIL_HOST,EMAIL_PORT,EMAIL_USER,EMAIL_PASS,
            JWT_SECRET,FRONTEND_URL,GOOGLE_CALLBACK_URL,GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET,MONGODB_URI,MONGODB_USERNAME,MONGODB_PASSWORD,
            LEMON_SQUEEZY_API_KEY,LEMON_SQUEEZY_WEBHOOK_SECRET,LEMON_SQUEEZY_STORE_ID,
            LEMON_SQUEEZY_VARIANT_ID_BASIC,LEMON_SQUEEZY_VARIANT_ID_PRO,LEMON_SQUEEZY_TEST_MODE
          script: |
            set -euo pipefail
            cd "$HOME/$EC2_APP_DIR"
            
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true
            sudo chkconfig nginx off 2>/dev/null || true          # sysv init
            sudo pkill -9 nginx 2>/dev/null || true
            sudo rm -f /etc/rc.d/rc[0-6].d/*nginx 2>/dev/null || true

            # Wait until 80/443 are free of NON-docker processes (our nginx
            # container legitimately owns them via docker-proxy). Fail only if
            # some other host process still holds the port after cleanup.
            PORTS_CLEAR=0
            for i in $(seq 1 30); do
              if ! sudo ss -tlnp | grep -E ':(80|443)[[:space:]]' | grep -v 'docker-proxy'; then
                PORTS_CLEAR=1
                break
              fi
              sleep 1
            done
            if [ "$PORTS_CLEAR" != "1" ]; then
              echo "FATAL: a non-container process still holds 80/443:"
              sudo ss -tlnp | grep -E ':(80|443)[[:space:]]' | grep -v 'docker-proxy' || true
              exit 1
            fi

            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f

            # Reload nginx so updated mount config takes effect.
            if docker ps --format '{{.Names}}' | grep -q '^plateai-nginx$'; then
              docker exec plateai-nginx nginx -s reload
            fi

      - name: Deployment summary
        run: 'echo "Live app: ${{ vars.PRODUCTION_URL }}"'